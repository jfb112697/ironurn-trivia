name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck client and worker
        run: npm run typecheck

      - name: Build client
        run: npm --workspace apps/web run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  engine:
    name: Data pipeline + engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r data/requirements.txt

      - name: Build the dataset from pybaseball
        working-directory: data
        run: python -m pipeline all --days 30

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify the TypeScript engine against the Python reference
        run: npm run verify

      - name: Verify the dataset bakes into the client build
        run: |
          npm run build
          test -f apps/web/dist/data/manifest.json
          test -f apps/web/dist/data/batting.json
          echo "Baked $(ls apps/web/dist/data | wc -l) dataset files into the static assets."
