name: Refresh dataset

# Rebuilds the dataset from pybaseball (Baseball Reference + Chadwick), ships it
# inside the deploy as static assets, and refreshes the R2 copy behind /api/*.
#
#   • Daily at 09:17 UTC        -> "17 9 * * *"
#   • Every 6 hours             -> "17 */6 * * *"
#   • Hourly during the season  -> "17 * 3-10 * *"
#
# Note: GitHub disables scheduled workflows in repositories that have had no
# activity for 60 days. Push a commit, or re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      end_season:
        description: "Last season to include (blank = newest the sources have)"
        required: false
        type: string
      modern_from:
        description: "First season sourced from Baseball Reference"
        required: false
        default: "2022"
        type: string

concurrency:
  group: refresh-dataset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check for Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Refresh skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run this workflow."
          fi

  refresh:
    name: Rebuild, publish and upload
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'ironurn-dataset' }}
      DATASET_PREFIX: ${{ vars.DATASET_PREFIX || 'v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r data/requirements.txt

      - name: Rebuild the dataset (pybaseball + Lahman)
        working-directory: data
        run: |
          ARGS=""
          if [ -n "${{ inputs.modern_from }}" ]; then
            ARGS="$ARGS --modern-from ${{ inputs.modern_from }}"
          fi
          if [ -n "${{ inputs.end_season }}" ]; then
            ARGS="$ARGS --end-season ${{ inputs.end_season }}"
          fi
          python -m pipeline refresh $ARGS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site first: the dataset is baked into the deploy, so publishing the
      # Worker makes the new season visible to players immediately.
      - name: Build the client and bake the dataset
        run: npm run build

      - name: Deploy the Worker (app + API)
        working-directory: workers/api
        run: npx wrangler deploy

      # Then the API copy behind R2.
      - name: Ensure the R2 bucket exists
        run: npx wrangler r2 bucket create "$R2_BUCKET" || true

      - name: Upload the dataset to R2
        run: node scripts/seed-r2.mjs

      - name: Job summary
        run: |
          {
            echo "### Dataset refreshed and published"
            echo
            echo '```json'
            cat data/out/meta.json | python -m json.tool | head -n 20
            echo '```'
            echo
            echo "The new season is live in the app (baked into the static assets)"
            echo "and behind the /api/* endpoints (R2, keyed by the manifest's"
            echo "\`generated\` revision so edge caches refresh on their own)."
          } >> "$GITHUB_STEP_SUMMARY"
