name: Deploy

# Builds the client, bakes the dataset in as static assets, and deploys the
# single Worker that serves both the app and /api/*.
#
# Static assets (the app bundle and the baked dataset) are free and unlimited
# on Cloudflare and do not count against the Worker request quota — only /api/*
# invocations do.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "workers/api/**"
      - "scripts/bake-data.mjs"
      - "scripts/fetch-data.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check for Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
          fi

  deploy:
    name: Build and deploy
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'ironurn-dataset' }}
      DATASET_PREFIX: ${{ vars.DATASET_PREFIX || 'v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ensure the R2 bucket exists
        run: npx wrangler r2 bucket create "$R2_BUCKET" || true

      - name: Restore the current dataset as static assets
        run: node scripts/fetch-data.mjs

      - name: Build the client and bake the dataset
        run: npm run build

      - name: Deploy the Worker (app + API)
        working-directory: workers/api
        run: npx wrangler deploy
