name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "workers/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Deploy edge API (Worker + R2)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ensure the R2 bucket exists
        run: npx wrangler r2 bucket create "${{ vars.R2_BUCKET || 'ironurn-dataset' }}" || true

      - name: Deploy the Worker
        working-directory: workers/api
        run: npx wrangler deploy

  web:
    name: Deploy web app (Cloudflare Pages)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the client
        run: npm --workspace apps/web run build
        env:
          # Set the API_BASE repository variable to the deployed Worker URL,
          # e.g. https://ironurn-api.<your-subdomain>.workers.dev/api
          VITE_DATA_BASE: ${{ vars.API_BASE || '/api' }}

      - name: Ensure the Pages project exists
        run: npx wrangler pages project create "${{ vars.PAGES_PROJECT || 'ironurn' }}" --production-branch=main || true

      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name="${{ vars.PAGES_PROJECT || 'ironurn' }}" --branch=main
